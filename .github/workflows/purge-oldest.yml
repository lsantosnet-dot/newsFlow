name: Apagar Artigos Mais Antigos

# Apaga os N artigos mais antigos (por curated_at) da coleção `articles`,
# preservando sempre os favoritos. Útil para limpar artigos que ficaram para
# trás e nunca serão lidos.
#
# Só roda manualmente: revise o resultado do dry-run (padrão) antes de marcar
# "dry_run: false" e apagar de fato.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Quantos artigos apagar (os mais antigos primeiro)"
        type: number
        default: 50
      profile:
        description: "Escopo: só o perfil ativo ou todos os perfis"
        type: choice
        options:
          - active
          - all
        default: active
      only_unread:
        description: "Considerar só artigos não lidos"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run: só relatar o que seria apagado, sem apagar"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Evita rodar ao mesmo tempo que a curadoria (que também escreve/apaga artigos).
  group: curadoria
  cancel-in-progress: false

jobs:
  purge-oldest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: curadoria/requirements.txt

      - name: Instalar dependências
        working-directory: curadoria
        run: pip install -r requirements.txt

      - name: Configurar credenciais da service account do Firestore
        working-directory: curadoria
        env:
          FIRESTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Aceita tanto o JSON bruto quanto o mesmo JSON codificado em base64 no secret.
          if [[ "${FIRESTORE_SERVICE_ACCOUNT_JSON:0:1}" == "{" ]]; then
            printf '%s' "$FIRESTORE_SERVICE_ACCOUNT_JSON" > service-account.json
          else
            printf '%s' "$FIRESTORE_SERVICE_ACCOUNT_JSON" | base64 -d > service-account.json
          fi

      - name: Apagar artigos mais antigos
        working-directory: curadoria
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/curadoria/service-account.json
          LIMIT: ${{ inputs.limit }}
          PROFILE: ${{ inputs.profile }}
          ONLY_UNREAD: ${{ inputs.only_unread }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--limit "$LIMIT" --profile "$PROFILE")
          [[ "$ONLY_UNREAD" == "true" ]] && args+=(--only-unread)
          [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
          python purge_oldest.py "${args[@]}"

      - name: Remover credenciais do runner
        if: always()
        working-directory: curadoria
        run: rm -f service-account.json
