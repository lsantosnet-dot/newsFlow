name: Curadoria de Notícias

# Roda o pipeline de ingestão + curadoria (Gemini) + gravação no Firestore,
# usando as fontes e os critérios do perfil ativo na coleção `profiles`.
# 100% serverless: nenhuma infraestrutura além do próprio runner do Actions.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Evita duas execuções simultâneas gravando/duplicando artigos no Firestore.
  group: curadoria
  cancel-in-progress: false

jobs:
  curadoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: curadoria/requirements.txt

      - name: Instalar dependências
        working-directory: curadoria
        run: pip install -r requirements.txt

      - name: Configurar credenciais da service account do Firestore
        working-directory: curadoria
        env:
          FIRESTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Aceita tanto o JSON bruto quanto o mesmo JSON codificado em base64 no secret.
          if [[ "${FIRESTORE_SERVICE_ACCOUNT_JSON:0:1}" == "{" ]]; then
            printf '%s' "$FIRESTORE_SERVICE_ACCOUNT_JSON" > service-account.json
          else
            printf '%s' "$FIRESTORE_SERVICE_ACCOUNT_JSON" | base64 -d > service-account.json
          fi

      - name: Rodar pipeline de curadoria
        working-directory: curadoria
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/curadoria/service-account.json
        run: python main.py

      - name: Remover credenciais do runner
        if: always()
        working-directory: curadoria
        run: rm -f service-account.json
