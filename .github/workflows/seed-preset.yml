name: Criar perfil a partir de preset

# Cria no Firestore um perfil definido em assets/presets/profiles.json, sem passar
# pelo app (ex: preset_id = github_ideias). Disparo manual.
# Nunca sobrescreve um perfil que já existe e o novo perfil nasce inativo.
on:
  workflow_dispatch:
    inputs:
      preset_id:
        description: "Id do preset em assets/presets/profiles.json"
        required: true
        default: "github_ideias"
      dry_run:
        description: "Só mostrar o que seria criado, sem gravar"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: curadoria/requirements.txt

      - name: Instalar dependências
        working-directory: curadoria
        run: pip install -r requirements.txt

      - name: Configurar credenciais da service account do Firestore
        working-directory: curadoria
        env:
          FIRESTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ "${FIRESTORE_SERVICE_ACCOUNT_JSON:0:1}" == "{" ]]; then
            printf '%s' "$FIRESTORE_SERVICE_ACCOUNT_JSON" > service-account.json
          else
            printf '%s' "$FIRESTORE_SERVICE_ACCOUNT_JSON" | base64 -d > service-account.json
          fi

      - name: Criar o perfil
        working-directory: curadoria
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/curadoria/service-account.json
          # Via env (e não interpolado no script) para a entrada não virar comando.
          PRESET_ID: ${{ inputs.preset_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python seed_preset.py "$PRESET_ID" --dry-run
          else
            python seed_preset.py "$PRESET_ID"
          fi

      - name: Remover credenciais do runner
        if: always()
        working-directory: curadoria
        run: rm -f service-account.json
